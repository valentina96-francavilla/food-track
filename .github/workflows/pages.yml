name: Validate FoodTrack
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: foodtrack-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Smoke test inline JavaScript and required UI hooks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script\b[^>]*>(.*?)</script>", html, flags=re.S | re.I)
          assert scripts, "No inline JavaScript found"
          Path("/tmp/foodtrack-inline.js").write_text(scripts[-1], encoding="utf-8")
          for marker in ("setupNav();", "renderAll()", "function deliveryISO", "submit_foodtrack_order", "save_foodtrack_cart"):
              assert marker in html, f"Missing required application marker: {marker}"

          # Business entities must come from Supabase, never from fixed demo names.
          for fixed_value in ("Fiorucci", "Venditti", "Negozio Milano", "Negozio Bari"):
              assert fixed_value not in html, f"Hard-coded business value found: {fixed_value}"
          assert '<select id="supplierFilter" class="field"><option value="all">Tutti i fornitori</option></select>' in html
          assert "supplierSelect.add(new Option(s.name,s.name))" in html
          assert "activeSuppliers=suppliers.filter(x=>x.active!==false)" in html
          assert "customerSelect.innerHTML=linked.length?" in html
          assert "suppliers.map(s=>" in html, "Product/customer supplier choices must be database-driven"
          assert "selectableSuppliers=suppliers.filter(s=>s.active!==false" in html, "New customer links must not default to inactive suppliers"
          assert "selectableProductSuppliers=role==='fornitore'?suppliers.filter" in html, "Product supplier choices must be role-scoped and active"
          assert html.count("deliveryDateShort(deliveryISO(o))") >= 2, "Order tables must format delivery dates as dd/mm/yy"
          assert "async function fetchFoodTrackRows" in html, "Core data reads must support pagination"
          assert "query.range(offset,offset+pageSize-1)" in html, "Core data reads must not silently stop at the first page"
          assert ".limit(1000)" not in html, "Fixed 1000-row cap found in core data reads"
          assert "storage.from('foodtrack-product-images')" in html, "Product uploads must use the secured FoodTrack bucket"
          assert "supplierId+'/products/'" in html, "Product image paths must be scoped to the owning supplier"
          assert "storage.from('product-images')" not in html, "Legacy unrestricted product image bucket is still referenced"
          print(f"HTML smoke checks passed; extracted {len(scripts[-1])} JavaScript characters and dynamic-data/storage guards passed")
          PY
          node --check /tmp/foodtrack-inline.js
