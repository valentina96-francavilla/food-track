name: Validate FoodTrack
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: foodtrack-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Smoke test inline JavaScript and required UI hooks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script\\b[^>]*>(.*?)</script>", html, flags=re.S | re.I)
          assert scripts, "No inline JavaScript found"
          Path("/tmp/foodtrack-inline.js").write_text(scripts[-1], encoding="utf-8")
          for marker in ("setupNav();", "renderAll()", "function deliveryISO", "submit_foodtrack_order", "save_foodtrack_cart"):
              assert marker in html, f"Missing required application marker: {marker}"
          print(f"HTML smoke checks passed; extracted {len(scripts[-1])} JavaScript characters")
          PY
          node --check /tmp/foodtrack-inline.js
